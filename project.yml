name: MrTipsworth

options:
  bundleIdPrefix: com.tipsworth
  deploymentTarget:
    iOS: "26.0"
  defaultConfig: Debug
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: 6.2
    ENABLE_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  MrTipsworth:
    type: application
    platform: iOS
    bundleId: com.tipsworth.mrtipsworth
    deploymentTarget: "26.0"
    sources:
      - path: MrTipsworth
    resources:
      - path: MrTipsworth/Assets.xcassets
      - path: MrTipsworth/MrTipsworth.storekit
    info:
      path: MrTipsworth/Info.plist
      properties:
        CFBundleDisplayName: Mr. Tipsworth
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
        SKAdNetworkItems: []
    entitlements:
      path: MrTipsworth/MrTipsworth.entitlements
      properties:
        com.apple.developer.in-app-payments:
          - com.tipsworth.smallcoin
          - com.tipsworth.supercoin
          - com.tipsworth.starcoin
    settings:
      base:
        PRODUCT_NAME: MrTipsworth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MrTipsworthTests:
    type: bundle.unit-test
    platform: iOS
    bundleId: com.tipsworth.mrtipsworth.tests
    sources:
      - path: MrTipsworthTests
    dependencies:
      - target: MrTipsworth
    settings:
      base:
        SWIFT_VERSION: 6.2
        GENERATE_INFOPLIST_FILE: YES
